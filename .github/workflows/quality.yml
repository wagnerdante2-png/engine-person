name: Engine Person Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate required product files
        run: |
          test -f index.html
          test -f styles.css
          test -f src/generators/human.js
          test -f src/generators/city.js
          test -f src/geometry/anatomy.js
          test -f src/generators/urban-plan.js
          test -f src/rig/skeleton.js
          test -f src/rig/skinning.js
          test -f src/rig/ik.js
          test -f src/rig/retarget.js
          test -f src/rig/animation-clip.js
          test -f src/generators/facial-animation.js
          test -f src/export/gltf.js
          test -f src/core/diagnostics.js
          test -f src/core/lod.js
      - name: Reject accidental merge markers
        run: '! grep -R -n -E "^(<<<<<<<|=======|>>>>>>>)" src index.html styles.css'
